<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>早餐食材選品中心｜限時搶購</title>

<style>
body{
    margin:0;
    text-align:center;
    font-family:sans-serif;
    background:#111;
}

/* =========================
    ⭐ 手機點擊優化
========================= */
html, body{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
}

a, button, .btn{
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
}

a:active, button:active, .btn:active{
    transform: scale(0.96);
    transition: transform 0.05s ease;
}

img{
    width:100%;
    max-width:600px;
    display:block;
    margin:0 auto 10px;
}

/* =========================
    按鈕樣式（完美對齊版）
========================= */
.btn{
    display:block;
    width:85%;
    max-width:420px;
    padding:16px 20px; 
    margin:12px auto;
    font-size:18px;
    border-radius:999px;
    text-decoration:none;
    font-weight:bold;
    box-sizing: border-box;
    border: none;
    cursor: pointer;
    white-space: nowrap; 
    line-height: 1.2;    
}

.store{
    background:#06C755;
    color:#fff;
    font-size: 17px; 
}

.online{background:#fff;color:#111;border:1px solid #ddd;}

/* LINE 專用按鈕（A、B組高度、寬度絕對同步） */
.lineBtn-a{
    background:linear-gradient(45deg,#06C755,#00e676);
    color:#fff;
}

.lineBtn-b{
    background:#06C755;
    color:#fff;
}

/* =========================
    套組標題與特效
========================= */
.bundle-title {
    color: #ffcc00; 
    font-size: 20px;
    margin: 25px 0 15px;
    font-weight: bold;
}

.flash{
    color:#ff3b3b;
    animation:flashAnim 1s infinite;
}

@keyframes flashAnim{
    0%,100%{opacity:1;}
    50%{opacity:0.4;}
}

.delivery{
    margin:8px 0 12px;
    font-size:13px;
    color:#000;
    background:linear-gradient(90deg,#ffd700,#ffcc00);
    display:inline-block;
    padding:6px 14px;
    border-radius:20px;
    font-weight:bold;
}

/* 跑馬燈（無縫循環） */
.marquee-container {
    overflow: hidden;
    white-space: nowrap;
    background: transparent;
    width: 100%;
    max-width: 600px;
    margin: 0 auto 15px;
}

.marquee {
    display: inline-block;
    animation: marqueeMove 15s linear infinite;
}

.marquee span {
    font-size: 13px;
    color: #ffcc00;
    padding-right: 50px;
}

@keyframes marqueeMove{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-50%); }
}

/* ⭐ 好評彈窗優化：移出主結構，修正計時器 Bug */
#popupOrder{
    position: relative; 
    width: 90%; 
    max-width: 420px;
    background:rgba(255, 255, 255, 0.98);
    color:#111;
    padding:12px 14px;
    border-radius:12px;
    font-size:12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    opacity:0; 
    transition: opacity 0.4s ease; 
    z-index: 10; 
    text-align: left;
    border-left: 5px solid #ff9800; 
    margin: 15px auto; 
    pointer-events:none; 
}

#popupOrder.show{
    opacity:1; 
}

/* 全家 Loading（固定在右下角，不與彈窗衝突） */
#loadingFami{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#06C755;
    color:#fff;
    padding:12px 16px;
    border-radius:12px;
    font-size:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    opacity:0;
    pointer-events:none;
    transition: all 0.3s ease;
    z-index:999;
}
</style>
</head>

<body>

<div style="background:#000; padding:24px 10px 20px;">

    <h1 style="margin:0 0 15px; font-size:22px; color:#fff; line-height:1.4;">
        早餐食材選品中心<br>
        <span class="flash">🔥 限時搶購</span>
    </h1>

    <p class="delivery">門市取貨 / 全家配送・超方便 🚚</p>

    <div class="marquee-container">
        <div class="marquee">
            <span>⏰ 今日訂單爆滿中・庫存快速減少！立即加入LINE官網・享團購優惠價</span>
            <span>⏰ 今日訂單爆滿中・庫存快速減少！立即加入LINE官網・享團購優惠價</span>
        </div>
    </div>

    <img src="./image1.png" alt="產品圖1">
    <img src="./image4.png" alt="產品圖2">
    <img src="./image5.png" alt="產品圖3">

    <p style="color:#fff;font-size:14px;margin:20px 0 10px;">請選擇取貨方式👇</p>

    <a href="https://freshbreakfast.github.io/order-group/" class="btn store">
        🔥 搶購（三重門市取貨）
    </a>

    <button class="btn online" onclick="goFami()">
        🚚 好賣+（全家配送）
    </button>

    <img src="./image6.png" alt="產品圖4">

    <div class="bundle-title">🎁 套組 &lt;特價&gt; 訂購</div>

    <div style="margin-top:10px;">
        <a class="btn lineBtn-a" href="https://line.me/R/oaMessage/@567ncwhd/?訂購A組特價%20$489%0A炸物拼盤x1、雞塊x1%0A薯條x1%0A（請輸入您的姓名與電話）">
            🔥 A組 開趴炸翻天 $489
        </a>

        <a class="btn lineBtn-b" href="https://line.me/R/oaMessage/@567ncwhd/?訂購B組特價%20$509%0A煎餃x1、三星蔥餅x1%0A紐澳良雞腿x1%0A蘑菇鐵板麵x2">
            👉 B組 輕鬆好料理 $509
        </a>
    </div>

    <div id="popupOrder"><div id="popupText"></div></div>
</div>

<div id="loadingFami">🟢 🚚 正在連線好賣+...</div>

<script>
// 恢復具有溫度的真實好評庫
const reviews = [
    { name: "板橋林先生", tag: "全家配送", text: "雞腿排肉質很厚實，用氣炸鍋弄一下就很多汁，配三星蔥餅當早餐很完美！" },
    { name: "中和張小姐", tag: "忠實老客", text: "A組的炸物拼盤份量很有誠意！週末在家跟家人開趴烤來吃，大家都說讚。" },
    { name: "新莊李小姐", tag: "網友強力推薦", text: "三重門市自取很快，老闆服務很親切！食材新鮮，放冷凍庫隨時煮都很方便。" },
    { name: "蘆洲黃先生", tag: "全家配送", text: "鐵板麵的醬汁味道很夠，跟早餐店賣的一模一樣！不用早起排隊就能吃到。" }
];

function r(a){return a[Math.floor(Math.random()*a.length)]}

function showPopup(){
    const el = document.getElementById("popupOrder");
    const text = document.getElementById("popupText");
    
    if(!el || !text) return; 
    
    const item = r(reviews);

    text.innerHTML = `
        <div style="margin-bottom:3px;">
            <span style="color:#ff9800; font-weight:bold; font-size:12px;">⭐⭐⭐⭐⭐ 好評分享</span>
        </div>
        <span style="color:#666; font-size:10px;">👤 ${item.name} ｜ <span style="background:#e8f5e9; color:#2e7d32; padding:0px 4px; border-radius:3px; font-size:9px;">${item.tag}</span></span>
        <p style="margin:5px 0 0; color:#222; font-weight:500; line-height:1.3; font-size:11px;">"${item.text}"</p>
    `;

    el.classList.add("show");
    setTimeout(() => {
        el.classList.remove("show");
    }, 4500); // 停留 4.5 秒利於閱讀
}

// 真正隨機時間的輪播計時器（修正 setInterval 無法隨機的 Bug）
function startMarqueePopup() {
    // 網頁載入 1.5 秒後跳出第一則
    setTimeout(() => {
        showPopup();
        nextPopup();
    }, 1500);
}

function nextPopup() {
    // 之後每隔 12~16 秒隨機輪播
    let randomTime = Math.random() * 4000 + 12000;
    setTimeout(() => {
        showPopup();
        nextPopup(); // 遞迴呼叫，確保每一次的時間間隔都是重新隨機計算的
    }, randomTime);
}

// 啟動彈窗
startMarqueePopup();

/* 好賣+ 導頁加載特效 */
let isGoing=false;
function goFami(){
    if(isGoing) return;
    isGoing=true;

    const loading=document.getElementById("loadingFami");
    loading.style.opacity="1";
    loading.style.pointerEvents="auto";

    setTimeout(()=>{
        window.location.href="https://famistore.famiport.com.tw/users/2903801";
        
        // 保險機制：若使用者按瀏覽器「上一頁」返回，重設按鈕狀態
        setTimeout(() => {
            isGoing = false;
            loading.style.opacity = "0";
            loading.style.pointerEvents = "none";
        }, 1500);
    },800);
}
</script>

</body>
</html>
