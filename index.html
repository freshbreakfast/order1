<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>早餐食材選品中心｜限時搶購</title>

<style>
body{
    margin:0;
    text-align:center;
    font-family:sans-serif;
    background:#111;
}

/* 手機優化 */
html, body{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
}

a, button{
    touch-action: manipulation;
    user-select: none;
}

button:active{
    transform: scale(0.97);
}

/* 圖片 */
img{
    width:100%;
    max-width:600px;
    display:block;
    margin:0 auto 10px;
}

/* 按鈕 */
.btn{
    display:block;
    width:85%;
    max-width:420px;
    padding:16px;
    margin:12px auto;
    font-size:18px;
    border-radius:999px;
    border:none;
    font-weight:bold;
}

.store{background:#06C755;color:#fff;}
.online{background:#fff;color:#111;}

/* LINE */
.lineBtn{
    display:block;
    margin:10px auto;
    border-radius:999px;
    text-decoration:none;
    font-weight:bold;
    color:#fff;
    background:#06C755;
}

.lineBtn.a{
    width:78%;
    max-width:360px;
    font-size:17px;
    padding:16px;
}

.lineBtn.b{
    width:65%;
    max-width:300px;
    font-size:15px;
    padding:13px;
}

/* 彈出通知 */
#popupOrder{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#fff;
    color:#111;
    padding:10px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    transform:translateY(20px);
    transition:0.3s;
    pointer-events:none;
}

#popupOrder.show{
    opacity:1;
    transform:translateY(0);
}

/* loading */
#loadingFami{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:99999;

    opacity:0;
    pointer-events:none;
    transition:0.25s;
}

.loader{
    width:40px;
    height:40px;
    border:4px solid #333;
    border-top:4px solid #06C755;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:15px;
}

@keyframes spin{
    0%{transform:rotate(0);}
    100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div style="background:#000;padding:24px 10px;">
<h1 style="color:#fff;">🔥 限時搶購<br>早餐食材選品中心</h1>

<img src="./image1.png">
<img src="./image4.png">
<img src="./image5.png">

<p style="color:#fff;">請選擇取貨方式👇</p>

<a href="https://freshbreakfast.github.io/order-group/" class="btn store">
🔥 搶購（三重門市取貨）
</a>

<!-- ⭐ 改這裡：好賣+ -->
<button class="btn online" ontouchstart="goFami()" onclick="goFami()">
🚚 好賣+（全家配送）
</button>

<img src="./image6.png">

<!-- LINE -->
<div style="color:#ffd700;font-size:12px;">🔥 最多人選這組</div>

<a class="lineBtn a" href="https://line.me/R/oaMessage/@567ncwhd/?訂購A組 $489">
🔥 A組: $489
</a>

<a class="lineBtn b" href="https://line.me/R/oaMessage/@567ncwhd/?訂購B組 $509">
👉 B組: $509
</a>

</div>

<!-- Popup -->
<div id="popupOrder"></div>

<!-- ⭐ Loading -->
<div id="loadingFami">
<div class="loader"></div>
<div>正在連線好賣+…</div>
<div style="font-size:12px;color:#aaa;">請稍候</div>
</div>

<script>
/* 好賣+ */
let isGoing = false;

function goFami(){
    if(isGoing) return;
    isGoing = true;

    let loading = document.getElementById("loadingFami");
    loading.style.opacity = "1";
    loading.style.pointerEvents = "auto";

    setTimeout(()=>{
        window.location.href = "https://famistore.famiport.com.tw/users/2903801";
    },300);
}

/* 假訂單 */
const names=["王小姐","陳先生","林小姐","張先生"];
const areas=["板橋","中和","三重","信義"];
const products=["A組","A組","A組","B組"];

function showPopup(){
    let el=document.getElementById("popupOrder");
    el.innerHTML=
    Math.floor(Math.random()*10+1)+"分鐘前<br>"+
    areas[Math.floor(Math.random()*areas.length)]+"的"+
    names[Math.floor(Math.random()*names.length)]+"<br>"+
    "訂購 "+products[Math.floor(Math.random()*products.length)];

    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },2000);
}

function loop(){
    setTimeout(()=>{
        showPopup();
        loop();
    },Math.random()*8000+6000);
}

setTimeout(loop,3000);
</script>

</body>
</html>
