<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>限時搶購</title>

<style>
body{
    margin:0;
    text-align:center;
    font-family:sans-serif;
    background:#111;
    color:#fff;
}

/* 限時搶購動畫 */
.flash-title{
    font-size:28px;
    margin:15px 0;
    animation: flash 1s infinite;
}
@keyframes flash{
    0%{opacity:1;}
    50%{opacity:0.4;}
    100%{opacity:1;}
}

/* 黃色配送 */
.delivery-bar{
    background:#FFD600;
    color:#000;
    font-weight:bold;
    padding:12px;
}

/* 灰色資訊 */
.info-bar{
    background:#333;
    padding:10px;
}

/* 圖片 */
.promo-img{
    width:90%;
    max-width:500px;
    margin:10px auto;
    display:block;
}

/* 套餐 */
.set-bar{
    background:#FF5722;
    color:#fff;
    font-size:20px;
    font-weight:bold;
    padding:15px;
    margin:15px;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1 class="flash-title">🔥 限時搶購 🔥</h1>

<div class="delivery-bar">
門市取貨 / 全家配送
</div>

<div class="info-bar">
好賣+全家配送
</div>

<!-- ⚠️ 先用測試圖片（避免你圖檔錯誤） -->
<img src="https://via.placeholder.com/500x300?text=Image6" class="promo-img">

<div class="set-bar" onclick="orderA()">
🔥 A組：開趴炸翻天 $489
</div>

<div class="set-bar" onclick="orderB()">
🔥 B組：輕鬆好料理 $509
</div>

<script>
function orderA(){
let msg = `訂購A組 共$489
檸檬雞柳x1 ‧ 脆薯x1 ‧ 夏威夷披撒x2`;

window.location.href =
"https://line.me/R/msg/text/?"+encodeURIComponent(msg);
}

function orderB(){
let msg = `訂購B組 共$509
紐澳良雞腿x1 ‧ 煎餃x1 ‧ 三星蔥餅x1 ‧ 蘑菇鐵板麵x2`;

window.location.href =
"https://line.me/R/msg/text/?"+encodeURIComponent(msg);
}
</script>

</body>
</html>
