<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>早餐食材選品中心｜限時搶購</title>

<style>
body{
    margin:0;
    text-align:center;
    font-family:sans-serif;
    background:#111;
}

html, body{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
}

a, button{
    -webkit-user-select:none;
}

a:active{
    transform: scale(0.97);
}

img{
    width:100%;
    max-width:600px;
    margin:auto;
    display:block;
}

.btn{
    display:block;
    width:85%;
    max-width:420px;
    padding:16px;
    margin:12px auto;
    border-radius:999px;
    font-weight:bold;
    text-decoration:none;
}

.store{background:#06C755;color:#fff;}
.online{background:#fff;color:#111;}

.lineBtn{
    display:block;
    margin:10px auto;
    border-radius:999px;
    padding:15px;
    color:#fff;
    background:#06C755;
    width:80%;
    max-width:360px;
    font-weight:bold;
}

.bundle{
    background:#fff;
    padding:20px;
}

.card{
    background:#f5f5f5;
    padding:15px;
    border-radius:12px;
    margin:10px auto;
    max-width:500px;
}

/* popup */
#popupOrder{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#fff;
    padding:10px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    transition:.3s;
}
#popupOrder.show{opacity:1;}
</style>
</head>

<body>

<h2 style="color:#fff;">🔥 早餐食材選品中心</h2>

<img src="./image1.png">
<img src="./image4.png">

<p style="color:#fff;">請選擇取貨方式👇</p>

<a class="btn store" onclick="goStore()">門市取貨</a>
<a class="btn online" onclick="goOnline()">全家配送</a>

<div class="bundle">
<h3>🎁 套組</h3>

<div class="card">
A組：$709
</div>

<div class="card">
B組：$550
</div>
</div>

<a class="lineBtn" onclick="order('A組')">🔥 LINE下單 A組</a>
<a class="lineBtn" onclick="order('B組')">👉 LINE下單 B組</a>

<div id="popupOrder"></div>

<script>

/* =========================
   ⭐ 核心：LINE下單
========================= */

function order(product){

    let msg = `我要訂購👉 ${product}\n姓名：\n電話：\n取貨方式：`;

    let url = "https://line.me/R/msg/text/?"+encodeURIComponent(msg);

    window.location.href = url;
}

/* =========================
   ⭐ 跳轉優化
========================= */

function goStore(){
    window.location.href="https://freshbreakfast.github.io/order-group/?utm=store";
}

function goOnline(){
    window.location.href="https://famistore.famiport.com.tw/users/2903801?utm=ship";
}

/* =========================
   ⭐ 假訂單 popup（已修正）
========================= */

const areas=["板橋","中和","新莊","台北","桃園"];
const names=["王小姐","陳先生","林小姐"];
const products=["A組","B組"];

function showPopup(){

    let text = 
        areas[Math.floor(Math.random()*areas.length)]+" "+
        names[Math.floor(Math.random()*names.length)]+
        " 訂購 "+products[Math.floor(Math.random()*products.length)];

    let el=document.getElementById("popupOrder");
    el.innerHTML=text;

    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },2000);
}

setInterval(showPopup,8000);

</script>

</body>
</html>
