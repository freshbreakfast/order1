<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>早餐食材優惠活動｜限時搶購</title>

<style>
body {
    margin: 0;
    text-align: center;
    font-family: sans-serif;
    background: #111;
    color:#fff;
}

img {
    width: 100%;
    max-width: 600px;
    display: block;
    margin: 0 auto;
}

.buttons {
    margin: 20px 0;
}

.btn {
    display: inline-block;
    padding: 16px 28px;
    margin: 10px;
    font-size: 16px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: bold;
}

.store {
    background-color: #06C755;
    color: white;
}

.online {
    background-color: #fff;
    color: #111;
}

.bundle {
    background:#fff;
    color:#111;
    padding:20px;
    margin:20px auto;
    max-width:600px;
    border-radius:12px;
}

.bundle h3 {
    margin:10px 0;
}

.lineBtn {
    background:#06C755;
    color:#fff;
    padding:12px;
    display:block;
    margin-top:10px;
    border-radius:8px;
    text-decoration:none;
}
</style>
</head>

<body>

<!-- 🔥 標題 -->
<div style="background:#000;padding:20px;">
<h1>
🔥 限時搶購<br>早餐食材優惠活動
</h1>
<p>🔥 早餐店等級食材，在家3分鐘上桌</p>
</div>

<!-- 第1頁 -->
<img src="https://freshbreakfast.github.io/DM-order/image1.png">

<!-- 第2頁 -->
<img src="https://freshbreakfast.github.io/DM-order/image4.png">

<!-- 🔥 第二張圖下面 CTA -->
<div class="buttons">

<a href="https://freshbreakfast.github.io/order-group/" class="btn store">
🔥 馬上搶！門市取貨
</a>

<a href="https://famistore.famiport.com.tw/users/2903801" class="btn online">
🚚 直接送到店！全家配送
</a>

</div>

<!-- 信任感 -->
<p style="font-size:13px;color:#ccc;">
✔ 早餐店老闆指定使用  
✔ 團購熱銷中  
✔ 冷凍配送安心保存
</p>

<!-- 第3頁 -->
<img src="https://freshbreakfast.github.io/DM-order/image5.png">

<!-- 🔥 第4頁 套組 -->
<div class="bundle">

<h2>🎁 套組下單</h2>

<h3>超值A組 $499</h3>
<p>里肌肉片×1、培根片×1、火腿×1、起司×1</p>

<a class="lineBtn"
href="https://line.me/R/msg/text/?我要訂購：超值A組%20$499%0A里肌肉片x1%0A培根片x1%0A火腿x1%0A起司x1">
👉 一鍵傳送LINE訂單
</a>

<h3>超值B組 $429</h3>
<p>雞塊×1、洋蔥圈×1、雞米花×1、薯餅×1</p>

<a class="lineBtn"
href="https://line.me/R/msg/text/?我要訂購：超值B組%20$429%0A雞塊x1%0A洋蔥圈x1%0A雞米花x1%0A薯餅x1">
👉 一鍵傳送LINE訂單
</a>

</div>

<!-- 🔥 自訂組合 -->
<div class="bundle">

<h2>🧾 自訂組合</h2>

<textarea id="orderText" placeholder="輸入品項，例如：
里肌肉片 2
培根 1"
style="width:100%;height:100px;"></textarea>

<button onclick="sendLine()" class="lineBtn">
👉 一鍵傳送訂單到LINE
</button>

</div>

<script>
function sendLine(){
  var text = document.getElementById("orderText").value;
  var url = "https://line.me/R/msg/text/?我要訂購：%0A" + encodeURIComponent(text);
  window.open(url);
}
</script>

</body>
</html>
