<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>早餐食材選品中心｜限時搶購</title>

<style>
body{
    margin:0;
    text-align:center;
    font-family:sans-serif;
    background:#111;
}

/* =========================
   ⭐ 手機點擊優化
========================= */
html, body{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
}

a, button, .btn, .lineBtn{
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
}

a:active, button:active, .btn:active, .lineBtn:active{
    transform: scale(0.98);
    transition: transform 0.05s ease;
}

img{
    width:100%;
    max-width:600px;
    display:block;
    margin:0 auto 10px;
}

/* =========================
   按鈕
========================= */
.btn{
    display:block;
    width:85%;
    max-width:420px;
    padding:16px 28px;
    margin:12px auto;
    font-size:18px;
    border-radius:999px;
    text-decoration:none;
    font-weight:bold;
}

.store{background:#06C755;color:#fff;}
.online{background:#fff;color:#111;border:1px solid #ddd;}

/* LINE */
.lineBtn{
    display:block;
    margin:10px auto;
    border-radius:999px;
    text-decoration:none;
    font-weight:bold;
    color:#fff;
    background:#06C755;
}

.lineBtn.a{
    width:78%;
    max-width:360px;
    font-size:17px;
    padding:16px 20px;
    background:linear-gradient(45deg,#06C755,#00e676);
}

.lineBtn.b{
    width:65%;
    max-width:300px;
    font-size:15px;
    padding:13px 18px;
}

/* =========================
   套組
========================= */
.bundle{
    background:#fff;
    color:#111;
    padding:20px 15px 10px;
    max-width:600px;
    margin:0 auto;
    border-radius:12px;
}

.flash{
    color:#ff3b3b;
    animation:flashAnim 1s infinite;
}

@keyframes flashAnim{
    0%,100%{opacity:1;}
    50%{opacity:0.3;}
}

.delivery{
    margin:8px 0 0;
    font-size:13px;
    color:#000;
    background:linear-gradient(90deg,#ffd700,#ffcc00);
    display:inline-block;
    padding:6px 14px;
    border-radius:20px;
    font-weight:bold;
}

.urgency{
    color:#ffcc00;
    font-size:12px;
    margin-top:6px;
    overflow:hidden;
    white-space:nowrap;
}

/* popup */
#popupOrder{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#fff;
    color:#111;
    padding:10px 14px;
    border-radius:12px;
    font-size:13px;
    max-width:220px;
    opacity:0;
    transform:translateY(20px);
    transition:all 0.35s ease;
    pointer-events:none;
    z-index:999;
}

#popupOrder.show{
    opacity:1;
    transform:translateY(0);
}

/* loading */
#loadingFami{
position:fixed;
bottom:20px;
right:20px;
background:#06C755;
color:#fff;
padding:12px 16px;
border-radius:12px;
font-size:14px;
box-shadow:0 6px 20px rgba(0,0,0,0.25);
opacity:0;
pointer-events:none;
transition:all .3s ease;
z-index:999;
}
</style>
</head>

<body>

<div style="background:#000;padding:24px 10px;">
<h1 style="margin:0;font-size:22px;color:#fff;">
<span class="flash">🔥 限時搶購</span><br>
早餐食材選品中心
</h1>

<p class="delivery">門市取貨 / 全家配送・超方便 🚚</p>

<div class="urgency">
⏰ 今日訂單爆滿中・庫存快速減少！
</div>

<img src="./image1.png">
<img src="./image4.png">
<img src="./image5.png">

<p style="color:#fff;font-size:13px;">請選擇取貨方式👇</p>

<a href="https://freshbreakfast.github.io/order-group/" class="btn store">
🔥 搶購（三重門市取貨）
</a>

<button class="btn online" onclick="goFami()">
🚚 好賣+（全家配送）
</button>

<img src="./image6.png">

<div class="bundle">
<h2 style="font-size:18px;margin:6px 0;">🎁 套組訂購</h2>
</div>

<div style="margin-top:10px;">
<a class="lineBtn a" href="https://line.me/R/oaMessage/@567ncwhd/?A組">
🔥 A組 $489
</a>

<a class="lineBtn b" href="https://line.me/R/oaMessage/@567ncwhd/?B組">
👉 B組 $509
</a>
</div>

</div>

<!-- popup -->
<div id="popupOrder"><div id="popupText"></div></div>

<!-- loading -->
<div id="loadingFami">🟢 🚚 正在連線好賣+...</div>

<script>
const names=["王小姐","陳先生","林小姐","張先生","李小姐"];
const areas=["新北板橋","新北中和","新北三重","台北信義","新莊","永和"];
const products=["A組","A組","A組","A組","B組"];

function r(a){return a[Math.floor(Math.random()*a.length)]}
function timeText(){return Math.floor(Math.random()*15+1)+"分鐘前"}

function showPopup(){
    const el=document.getElementById("popupOrder");
    const text=document.getElementById("popupText");

    text.innerHTML = `${timeText()}<br>${r(areas)}的${r(names)}<br>訂購了 <b>${r(products)}</b>`;

    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"),2200);
}

function loop(){
    setTimeout(()=>{
        showPopup();
        loop();
    },Math.random()*12000+8000);
}
setTimeout(loop,5000);

/* 好賣+ */
let isGoing=false;

function goFami(){
    if(isGoing) return;
    isGoing=true;

    const loading=document.getElementById("loadingFami");
    loading.style.opacity="1";
    loading.style.pointerEvents="auto";

    setTimeout(()=>{
        window.location.href="https://famistore.famiport.com.tw/users/2903801";
    },300);
}
</script>

</body>
</html>
