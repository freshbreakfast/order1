/* 動畫 */

    from{transform:translateY(-20px);opacity:0;}

@keyframes bounce{

.store{background:#06C755;color:#fff;}
.online{background:#fff;color:#111;border:1px solid #ddd;}

/* B 次要 */

/* 套組 */

.card{

/* 彈出通知 */

    right:20px;
    background:#fff;
    color:#111;
    padding:10px 14px;
    border-radius:12px;

    font-size:13px;
    max-width:220px;
    opacity:0;
    transform:translateY(20px);
    transition:all 0.4s ease;
    z-index:99999;
}
#popupOrder.show{
    opacity:1;
    transform:translateY(0);
}

<div id="popupOrder"><div id="popupText"></div></div>

<script>
const names=["王小姐","陳先生","林小姐","張先生","李小姐"];
const areas=["新北","台北","桃園","台中"];
const products=["A組","A組","A組","B組"];

function r(a){return a[Math.floor(Math.random()*a.length)];}

function timeText(){
    return Math.random()<0.6 ?
    Math.floor(Math.random()*40+10)+"秒前" :
    Math.floor(Math.random()*5+1)+"分鐘前";
}

function show(){
    let el=document.getElementById("popupOrder");
    let text=document.getElementById("popupText");

    text.innerHTML=`
    ${timeText()}<br>
    ${r(areas)}的${r(names)}<br>
    訂購了 <b>${r(products)}</b>
    `;

    el.classList.add("show");

    setTimeout(()=>{el.classList.remove("show");},3000);
}

function loop(){
    setTimeout(()=>{
        show();
        loop();
    },Math.random()*6000+6000);
}

setTimeout(loop,3000);
</script>
